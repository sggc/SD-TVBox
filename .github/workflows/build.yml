name: Build & Release

on:
  push:
    branches: [ main, master, release ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
            echo "storeFile=release.jks" >> local.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
            echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> local.properties
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: app/build/outputs/apk/**/release/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: APK
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.apk
          generate_release_notes: true
